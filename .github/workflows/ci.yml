name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pandas numpy pyarrow pyyaml scikit-learn prophet joblib scipy plotly streamlit wordcloud matplotlib

      - name: Run Tests
        run: |
          python -m pytest tests/ -v